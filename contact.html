<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contact | FrankTech Services</title><meta name="description" content="Tell us about your project by email, phone or WhatsApp."/><meta name="theme-color" content="#03050e"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet"/>
<script type="module" src="/src/main.js"></script></head>
<body data-page="contact"><div id="hdr"></div>
<main>
<section class="ph wrap"><h1>Let's talk about your project</h1><p class="lede">Tell us about your idea, business challenge or automation need. We will review it and reply with next steps.</p></section>
<section class="wrap sec tight"><div class="cgrid"><form id="form">
<label>Full name<input name="name" required autocomplete="name"/></label>
<label>Company name<input name="company" autocomplete="organization"/></label>
<label>Email address<input name="email" type="email" required autocomplete="email"/></label>
<label>Phone number<input name="phone" type="tel" autocomplete="tel"/></label>
<label>Service required<select name="service"><option value="">Choose a service</option><option>Custom software development</option><option>Website development</option><option>Mobile app development</option><option>AI development and integration</option><option>AI agents and automation</option><option>SaaS and startup products</option><option>UI/UX design</option><option>API development and integration</option><option>Cloud and DevOps</option><option>Data analytics and dashboards</option><option>Software testing and QA</option><option>Maintenance and support</option></select></label>
<label>Project budget (optional)<input name="budget"/></label>
<label class="full">Project description<textarea name="msg" rows="5" required></textarea></label>
<button class="btn" type="submit">Send project enquiry</button></form>
<aside class="direct"><h3>Prefer to talk?</h3>
<p>Email<br/><a data-mail></a></p><p>Phone and WhatsApp<br/><a data-tel></a></p>
<a class="btn ghost" data-wa target="_blank" rel="noopener">Chat with us on WhatsApp</a></aside></div></section>
</main><div id="ftr"></div></body></html>
